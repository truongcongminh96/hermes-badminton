<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Hermes badminton play systems graphic</title>
  <desc id="description">Abstract badminton court, racket frame, shuttle trajectory and HB poster forms.</desc>
  <defs>
    <pattern id="courtGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffe6cb" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#ffe6cb" fill-opacity=".18"/>
      <circle cx="11" cy="11" r=".8" fill="#ffbd38" fill-opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" fill="url(#courtGrid)"/>
  <rect x="960" width="640" height="760" fill="url(#halftone)"/>

  <g fill="none" stroke="#ffe6cb" stroke-opacity=".18">
    <rect x="770" y="92" width="710" height="560" stroke-width="2"/>
    <path d="M1125 92v560M770 372h710M770 232h710M770 512h710"/>
    <path d="M805 92v560M1445 92v560" stroke-dasharray="10 13"/>
  </g>

  <text x="875" y="610" fill="#ffe6cb" fill-opacity=".055" font-family="Georgia, serif" font-size="610" font-weight="700" letter-spacing="-70">HB</text>

  <g transform="rotate(-16 1230 386)" fill="none" stroke="#ffe6cb" stroke-opacity=".2">
    <ellipse cx="1230" cy="340" rx="240" ry="168" stroke-width="5"/>
    <ellipse cx="1230" cy="340" rx="220" ry="148" stroke-width="1.5"/>
    <path d="M1100 480 972 650M1120 492 995 660" stroke-width="6"/>
    <path d="m978 642-40 56m62-45-42 59" stroke-width="12"/>
  </g>

  <path d="M420 610C690 510 770 210 1060 160c180-31 307 13 456 132" fill="none" stroke="#ffbd38" stroke-opacity=".38" stroke-width="5" stroke-linecap="round"/>
  <path d="M420 627C690 527 780 231 1067 180c178-32 300 7 448 124" fill="none" stroke="#ffe6cb" stroke-opacity=".16" stroke-width="2" stroke-dasharray="12 18"/>

  <g transform="translate(1032 155) rotate(18)" fill="none" stroke="#ffbd38" stroke-linecap="round">
    <path d="M0 0 40 13M2 7l33 29M9-3l12 40" stroke-opacity=".5" stroke-width="3"/>
    <path d="m39 13 28 11-22 29-10-17z" stroke-opacity=".45" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#ffe6cb" stroke-linecap="round" stroke-opacity=".17">
    <path d="M1110 82c48 13 69 10 110-4" stroke-width="4"/>
    <path d="M1120 66c38 9 64 5 96-8" stroke-width="2"/>
    <path d="M1328 665c51-16 93-13 137 4" stroke-width="5"/>
    <path d="M1342 684c38-12 72-9 108 5" stroke-width="2"/>
  </g>

  <g fill="#ffbd38" fill-opacity=".28">
    <circle cx="420" cy="610" r="6"/>
    <circle cx="1060" cy="160" r="5"/>
    <circle cx="1516" cy="292" r="5"/>
  </g>
</svg>
